# CybroidOS brand identity (the OS was CybroidOS until 0.1.1)
#
# Single source of truth for branding values. tools/render-brand.py reads this
# file and renders a filesystem overlay per target (see targets.toml), so
# branding is defined exactly once and flows to every image.
#
# Palette is DERIVED from the Cybroid logo art in logo/cybroid-logo.svg
# (band gradient #3a7cff -> #2c9dff -> #1ccbff, circuit #18d8ff, tile
# #16224a -> #0d1530). Confirm/adjust with the brand owner before a release;
# treat these as v0 defaults.

[identity]
name            = "CybroidOS"
id              = "cybroid"                 # os-release ID, hostname, package prefix, install paths
vendor          = "Cybroid Technologies (U) Ltd"
vendor_short    = "Cybroid"
pretty_name     = "CybroidOS"
version         = "0.1.16"
default_hostname = "cybroid"
support_url     = "https://cybroid.com"
home_url        = "https://cybroid.com/cybroidos"
documentation   = "https://github.com/cybroidos/os"
bug_report_url  = "https://github.com/cybroidos/os/issues"

[colors]
# Roles. Derived from the Cybroid logo SVG; see header note.
primary        = "#16224a"   # navy — primary brand / dark surfaces
primary_deep   = "#0d1530"   # deepest navy — background
accent         = "#1ccbff"   # cyan — primary accent / highlights
accent_alt     = "#3a7cff"   # blue — secondary accent (band gradient start)
glow           = "#18d8ff"   # circuit traces / focus glow
background     = "#0d1530"
foreground     = "#ffffff"
on_accent      = "#0d1530"

[assets]
# Source art, relative to common/branding/. Renderers install these under
# role names (logo.svg, mark.svg, ...) so consumers never depend on file names.
logo           = "logo/cybroid-logo.svg"                       # app-icon tile (navy rounded square)
logo_animated  = "logo/cybroid-logo-animated.svg"              # tile, CSS-animated (browsers only)
mark           = "logo/cybroid-mark.svg"                       # transparent mark, static (rasterisable)
mark_animated  = "logo/cybroid-mark-animated-transparent.svg"  # transparent mark, CSS-animated (browsers only)

# Editions: the same CybroidOS with one package of a profession's tools
# (common/packages/cybroid-edition-<id>). targets/desktop/build-iso.sh builds
# one with EDITION=<id> as cybroidos-<id>-<version>-amd64.iso; without it,
# the plain desktop (cybroidos-desktop-...). An installed CybroidOS becomes
# an edition by installing its package; Settings > About lists those present.
[editions.security]
name        = "Security"
description = "For analysts and security teams"

[editions.developer]
name        = "Developer"
description = "For engineers who build software"

[editions.network]
name        = "Network"
description = "For network engineers and students"

[editions.engineering]
name        = "Engineering"
description = "For electronics, CAD and science"

[editions.classroom]
name        = "Classroom"
description = "For school computer rooms"
