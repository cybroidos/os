name: cybroidos_connect
description: >-
  Pure Dart v0 skeleton of the KDE Connect protocol v8 client library for the
  Cybroid OS mobile control app. Discovery, TLS pinning, pairing, packets and
  plugins are interfaces/partial implementations, not a production transport.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # crypto is used today for SHA-256 pin helpers; the other two are reserved
  # for the TLS/X.509 work described in README.md.
  crypto: ^3.0.3
  cryptography: ^2.7.0
  pointycastle: ^3.7.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
