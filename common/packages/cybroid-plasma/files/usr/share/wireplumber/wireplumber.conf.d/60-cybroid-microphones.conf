# CybroidOS (cybroid-plasma): microphones start at 50% (0.125: WirePlumber's
# volumes are linear, its sliders cubic), not WirePlumber's 100%. At 100% a
# laptop's analog mic has its boost and capture gain both at full (+60 dB on
# a Dell Latitude 7290's Realtek ALC3246): the room's hiss filled every
# recording and voices were lost in it ("the camera records no sound").
# A volume someone sets is kept as before.
wireplumber.settings = {
  device.routes.default-source-volume = 0.125
}
