<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the Cybroid desktop user may own the service name. -->
  <policy user="cybroid">
    <allow own="com.cybroidos.Control"/>
    <allow send_destination="com.cybroidos.Control" send_interface="com.cybroidos.Control"/>
    <allow send_destination="com.cybroidos.Control" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.cybroidos.Control" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="com.cybroidos.Control" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>

  <!-- The headless pod-side KDE Connect daemon may call methods, not own the name. -->
  <policy user="kcd">
    <allow send_destination="com.cybroidos.Control" send_interface="com.cybroidos.Control"/>
    <allow send_destination="com.cybroidos.Control" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>

  <policy context="default">
    <deny own="com.cybroidos.Control"/>
    <deny send_destination="com.cybroidos.Control"/>
  </policy>
</busconfig>
