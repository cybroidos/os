name: APT repository

# Publishes every CIT-OS package to the signed APT repository on GitHub Pages
# (ADR-0007). Needs the repository secret CITOS_APT_SIGNING_KEY: an
# ASCII-armoured GnuPG secret key with no passphrase, used only for this.
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  arch-all:
    name: Build arch-independent packages
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates python3 dpkg-dev librsvg2-bin
          tools/build-package.sh --all
      - uses: actions/upload-artifact@v4
        with:
          name: packages-all
          path: dist/*.deb

  kiosk-app:
    uses: ./.github/workflows/kiosk-app.yml

  publish:
    name: Sign and publish
    needs: [arch-all, kiosk-app]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: '{packages-all,citos-kiosk-app}'
          path: debs
          merge-multiple: true
      - name: Import the signing key
        env:
          KEY: ${{ secrets.CITOS_APT_SIGNING_KEY }}
        run: printf '%s\n' "$KEY" | gpg --batch --import
      - name: Build the repository
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends reprepro
          tools/publish-apt-repo.sh debs/*.deb
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo/published
      - id: deploy
        uses: actions/deploy-pages@v4
