# CybroidOS Desktop (cybroid-plasma): SSH by key from any network; by
# password only over Tower (the private network), where every device is one
# you approved. The live system's password is public ("cybroid"), so a
# password sign-in from the open network is never allowed. No root sign-in.
# The first value set wins, and these load before Debian's sshd_config.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no

Match Address 100.64.0.0/10,fd7a:115c:a1e0::/48
	PasswordAuthentication yes

# Ends the Match above, so nothing read after this file falls under it.
Match all
