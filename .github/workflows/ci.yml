name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# All jobs run INSIDE Debian 13 "Trixie" so CI matches the shipping base OS
# (ADR-0001). The runner host is Ubuntu only because GitHub does not offer a
# Debian runner image; the `container:` keeps the job environment on Debian.
jobs:
  validate-repo:
    name: Validate repo & branding (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3

      - name: Validate brand.toml and targets.toml
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          root = pathlib.Path("common/branding")
          data = tomllib.loads((root / "brand.toml").read_text())
          for section in ("identity", "colors", "assets"):
              assert section in data, f"missing [{section}] in brand.toml"
          for role, rel in data["assets"].items():
              assert (root / rel).is_file(), f"asset {role}: missing {rel}"
          targets = tomllib.loads((root / "targets.toml").read_text())
          for name in ("base", "rpi", "desktop", "server", "container"):
              assert name in targets, f"missing [{name}] in targets.toml"
          ident = data["identity"]
          print(f"brand OK: {ident['name']} (id={ident['id']}), targets: {', '.join(targets)}")
          PY

      - name: Validate SVGs are well-formed
        run: |
          python3 - <<'PY'
          import pathlib, xml.dom.minidom
          for f in sorted(pathlib.Path("common/branding").rglob("*.svg")):
              if "templates" in f.parts:
                  continue  # templates hold ${placeholders}; checked after rendering
              xml.dom.minidom.parse(str(f))
              print(f"SVG OK: {f}")
          PY

      - name: Validate devcontainer.json
        run: |
          python3 - <<'PY'
          import json, pathlib
          f = pathlib.Path(".devcontainer/devcontainer.json")
          cfg = json.loads(f.read_text())
          assert "build" in cfg, "devcontainer.json missing 'build'"
          print(f"devcontainer.json OK: {cfg.get('name', '?')}")
          PY

      - name: Syntax-check tooling
        run: |
          python3 -m py_compile tools/render-brand.py tools/brand_anim.py common/services/cybroid_robot/*.py
          echo "render-brand.py compiles"
          bash -n targets/rpi/config
          bash -n targets/rpi/build.sh
          bash -n targets/rpi/stage-cybroid/prerun.sh
          bash -n targets/rpi/stage-cybroid/00-cybroid/01-run.sh
          bash -n targets/rpi/stage-cybroid/00-cybroid/02-run.sh
          bash -n targets/rpi/stage-cybroid/00-cybroid/03-run.sh
          echo "targets/rpi scripts parse"

      - name: Check required files exist
        run: |
          for f in \
            README.md \
            docs/PLAN.md \
            docs/dev-environments.md \
            docs/adr/ADR-0001-base-distribution.md \
            docs/adr/ADR-0002-kiosk-runtime.md \
            docs/adr/ADR-0003-desktop-environment.md \
            docs/adr/ADR-0004-mobile-client.md \
            docs/adr/ADR-0005-pod-image-variants.md \
            docs/adr/ADR-0006-pi-image-builder.md \
            docs/adr/ADR-0007-shared-packages-and-apt-repo.md \
            docs/research/kiosk-runtime.md \
            docs/research/desktop-environment.md \
            docs/research/desktop-mobile-control.md \
            .devcontainer/Dockerfile \
            .devcontainer/devcontainer.json \
            tools/preflight.sh \
            tools/render-brand.py \
            tools/build-package.sh \
            tools/fatread.py \
            tests/qemu/rpi-gui-test.sh \
            targets/rpi/config \
            targets/rpi/build.sh \
            targets/rpi/stage-cybroid/EXPORT_IMAGE \
            targets/rpi/stage-cybroid/00-cybroid/02-run.sh \
            targets/rpi/stage-cybroid/00-cybroid/03-run.sh \
            common/packages/copyright \
            common/packages/cybroid-base/control \
            common/packages/cybroid-kiosk/files/usr/bin/cybroid-kiosk \
            common/packages/cybroid-kiosk/files/etc/cybroid/kiosk.conf \
            common/packages/cybroid-robot/control \
            common/services/cybroid_robot/kioskd.py \
            apps/kiosk/pubspec.yaml \
            apps/kiosk/.fvmrc \
            common/branding/brand.toml \
            common/branding/targets.toml \
            tests/qemu/virt-kiosk-test.sh \
            tests/qemu/apply-source.sh \
            tools/brand_anim.py ; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "all required files present"

  render-branding:
    name: Render branding for every target (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 librsvg2-bin

      - name: Render all targets
        run: |
          for t in $(python3 tools/render-brand.py --list | awk '{print $1}'); do
            python3 tools/render-brand.py --target "$t" --out "out/branding/$t"
          done

      - name: Check rendered output
        run: |
          python3 - <<'PY'
          import pathlib, xml.dom.minidom
          out = pathlib.Path("out/branding")
          for t in ("base", "rpi", "desktop", "server", "container"):
              rel = (out / t / "usr/lib/os-release").read_text()
              assert "ID=cybroid" in rel, t
          for f in out.rglob("*.svg"):
              xml.dom.minidom.parse(str(f))
          for f in out.rglob("*.png"):
              assert f.read_bytes()[:8] == b"\x89PNG\r\n\x1a\n" and f.stat().st_size > 100, f
          for f in out.rglob("*"):
              if f.suffix in (".html", ".script", ".plymouth", ".svg") or f.name in ("motd", "issue", "os-release"):
                  assert "${" not in f.read_text(), f"unrendered placeholder in {f}"
          print("rendered branding OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: cit-os-branding
          path: out/branding/

  build-packages:
    name: Build, install and remove the CybroidOS packages (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 dpkg-dev librsvg2-bin lintian

      - name: Build packages
        run: tools/build-package.sh --all

      - name: Inspect packages
        run: |
          for deb in dist/*.deb; do echo "== $deb"; dpkg-deb -I "$deb" | sed -n '/Package:/,/Description:/p'; done

      - name: Install on a clean Trixie root
        run: |
          # Everything that installs here; the arm64 app/runtime and the
          # cybroid-robot metapackage that needs them are built in pi-image.yml.
          apt-get install -y --no-install-recommends \
            ./dist/cybroid-base_*.deb ./dist/cybroid-artwork_*.deb \
            ./dist/cybroid-plymouth-theme_*.deb ./dist/python3-cybroid-robot_*.deb \
            ./dist/cybroid-system_*.deb ./dist/cybroid-kiosk_*.deb ./dist/cybroid-robot-hw_*.deb

      - name: Verify what the packages did
        run: |
          set -x
          grep -q '^ID=cybroid' /etc/os-release
          grep -q 'CybroidOS' /etc/motd
          grep -q '^Theme=cybroid$' /etc/plymouth/plymouthd.conf
          test -f /usr/share/plymouth/themes/cybroid/anim-000.png
          test -f /usr/share/icons/hicolor/256x256/apps/cybroid.png
          test -f /etc/mosquitto/conf.d/cybroid.conf
          test -L /etc/systemd/system/multi-user.target.wants/cybroid-system.service
          python3 -c 'import cybroid_robot.kioskd, cybroid_robot.system, cybroid_robot.bus'
          cybroid-kiosk --help | grep -q 'kiosk supervisor'

      - name: Remove and check base-files is restored
        run: |
          apt-get remove -y cybroid-base cybroid-artwork cybroid-plymouth-theme cybroid-kiosk cybroid-system python3-cybroid-robot cybroid-robot-hw
          grep -q '^ID=debian' /etc/os-release
          ! grep -q '^Theme=cybroid$' /etc/plymouth/plymouthd.conf

      - name: Lintian (non-fatal)
        run: lintian dist/*.deb || true

      - uses: actions/upload-artifact@v4
        with:
          name: cybroid-packages-all
          path: dist/*.deb

  services:
    name: Robot services unit tests (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5
      - name: Install Python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3
      - name: Run tests
        run: python3 -m unittest discover -s tests/services -v

  kiosk-app:
    name: Flutter kiosk app (analyze + test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/kiosk
    steps:
      - uses: actions/checkout@v5

      - name: Read the pinned Flutter version
        id: fvm
        run: echo "version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable

      - name: Generated branding is up to date
        working-directory: .
        run: |
          python3 tools/render-brand.py --emit-dart apps/kiosk/lib/src/brand.g.dart
          git diff --exit-code apps/kiosk/lib/src/brand.g.dart

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  shellcheck:
    name: Shellcheck (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git shellcheck

      - name: Shellcheck all shell scripts
        shell: bash
        run: |
          mapfile -t files < <(find tools ci tests targets -name '*.sh' 2>/dev/null || true)
          files+=(common/packages/*/prepare common/packages/*/files/usr/bin/cybroid-kiosk)
          for f in common/packages/*/{preinst,postinst,prerm,postrm}; do
            [ -f "$f" ] && files+=("$f")
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell scripts yet"
            exit 0
          fi
          shellcheck -x "${files[@]}"

  # Build jobs (Pi, desktop, server, docker) are added in later phases.
  # See docs/PLAN.md — Phase 3 onwards.
