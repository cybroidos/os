# CIT-OS sign-in screen (citos-desktop).
[Greeter]
background = /usr/share/backgrounds/citos/citos-1920x1080.png
background-color = #0d1530
draw-user-backgrounds = false
draw-grid = false
theme-name = Orchis-Dark
icon-theme-name = Papirus-Dark
font-name = Inter 11
clock-format = %a %d %b, %H:%M
show-hostname = true
show-a11y = false
show-keyboard = false
