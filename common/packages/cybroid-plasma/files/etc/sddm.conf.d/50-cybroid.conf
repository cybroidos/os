# CybroidOS sign-in (cybroid-plasma): the CybroidOS Horizon theme, into Plasma on X11
# (which Remote Desktop and Hangar's Screen tab use too).
[Theme]
Current=cybroid
CursorTheme=breeze_cursors

[General]
# The on-screen keyboard (the Keyboard button on the sign-in screen).
InputMethod=qtvirtualkeyboard
DisplayServer=x11
DefaultSession=plasmax11.desktop
