# A release's downloads: on a tag v<version>, every edition's installer ISO
# is built from that commit, given its checksum and package manifest, and
# published to download.cybroid.com (Cloudflare R2, tools/downloads.sh
# publish). One edition at a time on Hangar's builders. Packages reach
# deb.cybroid.com from the version bump on main (images.yml).
#
# Secrets: CYBROID_R2_ENDPOINT, CYBROID_R2_ACCESS_KEY_ID,
# CYBROID_R2_SECRET_ACCESS_KEY (an R2 token for the downloads bucket only).
name: Release images

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: "1"
  DOWNLOAD_URL: https://download.cybroid.com

jobs:
  iso:
    name: ${{ matrix.edition }} ISO
    runs-on: cybroid-builder
    timeout-minutes: 300
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        edition: [desktop, security, developer, network, engineering, classroom]
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token $TOKEN" fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q --force FETCH_HEAD
          git clean -q -ffdx
          git log --oneline -1

      - name: The tag matches brand.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("common/branding/brand.toml","rb"))["identity"]["version"])')"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "tag ${GITHUB_REF_NAME} but brand.toml says ${version}"; exit 1; }

      - name: Build the packages from outside Debian (dist/extra)
        run: tools/build-extras.sh iso

      - name: Build the ${{ matrix.edition }} ISO
        run: |
          sudo EXTRA_DEBS="$PWD/dist/extra" OUT="$PWD/out" EDITION="${{ matrix.edition }}" targets/desktop/build-iso.sh
          sudo chown -R "$(id -u):$(id -g)" out dist
          iso=$(ls out/cybroidos-*-amd64.iso)
          ls -lh "$iso"
          pk="${iso%.iso}.packages"
          tools/release-manifest.sh --edition "${{ matrix.edition }}" $( [ -f "$pk" ] && echo --packages-file "$pk" ) out "${iso%.iso}.manifest.md"

      - name: Publish to download.cybroid.com
        env:
          R2_ENDPOINT: ${{ secrets.CYBROID_R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.CYBROID_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CYBROID_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: cybroidos-downloads
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ]; then echo "No R2 keys: built but not published"; exit 0; fi
          tools/downloads.sh publish out/cybroidos-*-amd64.iso out/cybroidos-*-amd64.manifest.md

      - name: Clean up
        if: always()
        run: |
          sudo rm -rf out dist
          sudo rm -rf /var/tmp/cybroid-build.*
          sudo chown -R "$(id -u):$(id -g)" .
