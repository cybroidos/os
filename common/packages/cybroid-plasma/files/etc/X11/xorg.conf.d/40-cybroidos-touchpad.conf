# CybroidOS desktop (cybroid-plasma): touchpads click when tapped. libinput
# leaves tapping off, so a touchpad moved the pointer but never clicked
# (only its buttons did, which many have none of). Also: two fingers for the
# right click, a tap and drag to move things, natural scrolling (content
# follows the fingers, as on phones), and no stray taps while typing.
# Each person can change these in Settings > Touchpad.
Section "InputClass"
	Identifier "CybroidOS touchpad"
	MatchIsTouchpad "on"
	MatchDriver "libinput"
	Option "Tapping" "on"
	Option "TappingButtonMap" "lrm"
	Option "TappingDrag" "on"
	Option "ClickMethod" "clickfinger"
	Option "NaturalScrolling" "true"
	Option "DisableWhileTyping" "on"
EndSection
