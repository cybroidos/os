# CybroidOS desktop (cybroid-plasma): a silent boot behind the CybroidOS splash, as
# macOS and Windows hide theirs. No boot menu (hold Shift or press Esc for
# it), no kernel or service messages on screen (Esc during the splash shows
# them), no blinking cursor. The serial console (Hangar's Console tab) keeps
# its messages: Plymouth ignores it instead of falling back to text mode.
GRUB_TIMEOUT_STYLE=hidden
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=false vt.global_cursor_default=0 plymouth.ignore-serial-consoles"
