name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# All jobs run INSIDE Debian 13 "Trixie" so CI matches the shipping base OS
# (ADR-0001). The runner host is Ubuntu only because GitHub does not offer a
# Debian runner image; the `container:` keeps the job environment on Debian.
jobs:
  validate-repo:
    name: Validate repo & branding (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3

      - name: Validate brand.toml
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("common/branding/brand.toml").read_text())
          for section in ("identity", "colors", "assets"):
              assert section in data, f"missing [{section}] in brand.toml"
          ident = data["identity"]
          print(f"brand.toml OK: {ident['name']} (id={ident['id']})")
          PY

      - name: Validate logo SVG is well-formed
        run: |
          python3 - <<'PY'
          import pathlib, xml.dom.minidom
          f = pathlib.Path("common/branding/logo/cybroid-logo.svg")
          xml.dom.minidom.parse(str(f))
          print(f"SVG OK: {f}")
          PY

      - name: Validate devcontainer.json
        run: |
          python3 - <<'PY'
          import json, pathlib
          f = pathlib.Path(".devcontainer/devcontainer.json")
          cfg = json.loads(f.read_text())
          assert "build" in cfg, "devcontainer.json missing 'build'"
          print(f"devcontainer.json OK: {cfg.get('name', '?')}")
          PY

      - name: Validate control action catalogue
        run: |
          python3 - <<'PY'
          import json, pathlib
          f = pathlib.Path("common/packages/cybroidos-control/debian/payload/usr/share/cybroidos/control/actions.json")
          data = json.loads(f.read_text())
          assert isinstance(data, (list, dict)), "actions.json must be a list or object"
          print(f"actions.json OK: {f}")
          PY

      - name: Syntax-check tooling
        run: |
          python3 -m py_compile tools/render-brand.py
          echo "render-brand.py compiles"
          bash -n targets/rpi/config
          bash -n targets/rpi/build.sh
          bash -n targets/rpi/stage-cybroidos/prerun.sh
          bash -n targets/rpi/stage-cybroidos/00-cybroidos/01-run.sh
          bash -n targets/rpi/stage-cybroidos/00-cybroidos/02-kiosk.sh
          bash -n targets/rpi/stage-cybroidos/00-cybroidos/03-packages.sh
          bash -n targets/desktop/build.sh
          bash -n targets/desktop/build-meta.sh
          bash -n apps/mobile/relay/setup-relay.sh
          bash -n targets/docker/build.sh
          bash -n tests/container/smoke-test.sh
          for f in targets/docker/config/*.sh; do bash -n "$f"; done
          bash -n targets/server/build.sh
          for f in targets/server/hooks/*.sh \
                   targets/server/config/xfce-session \
                   targets/server/config/xrdp/startwm.sh \
                   tests/server/smoke-test.sh; do bash -n "$f"; done
          for f in editions/*/config; do bash -n "$f"; done
          echo "edition configs parse"
          echo "targets/rpi scripts parse"

      - name: Check required files exist
        run: |
          for f in \
            README.md \
            LICENSE \
            LICENSE-ASSETS \
            NOTICE.md \
            docs/LICENSING.md \
            docs/PROPRIETARY-COMPONENTS.md \
            docs/END-USER-READINESS.md \
            docs/SECURITY-POSTURE.md \
            docs/SECURITY.md \
            docs/APT-REPO.md \
            docs/RELEASE-CHECKLIST.md \
            docs/release/HARDWARE-CHECKLIST.md \
            docs/user/INSTALL.md \
            docs/user/FIRST-BOOT.md \
            docs/user/UPDATES.md \
            docs/user/RECOVERY.md \
            docs/user/SUPPORT.md \
            editions/README.md \
            editions/core/config \
            editions/education/config \
            editions/developer/config \
            editions/professional/config \
            editions/enterprise/config \
            docs/BUILD-GUIDE.md \
            docs/ADD-PACKAGE.md \
            docs/SWAP-KIOSK-APP.md \
            docs/ADD-HARDWARE-TARGET.md \
            apps/kiosk/flutter/pubspec.yaml \
            apps/kiosk/flutter/lib/main.dart \
            tools/build-kiosk-flutter.sh \
            docs/EDITION-STRATEGY.md \
            tools/release-manifest.sh \
            tools/check-proprietary.sh \
            tools/pin-actions.sh \
            apt-repo/publish.sh \
            docs/PLAN.md \
            docs/dev-environments.md \
            docs/adr/ADR-0001-base-distribution.md \
            docs/adr/ADR-0002-kiosk-runtime.md \
            docs/adr/ADR-0003-desktop-environment.md \
            docs/adr/ADR-0004-mobile-client.md \
            docs/adr/ADR-0005-pod-image-variants.md \
            docs/adr/ADR-0006-pi-image-builder.md \
            docs/adr/ADR-0007-shared-packages-and-apt-repo.md \
            docs/research/kiosk-runtime.md \
            docs/research/desktop-environment.md \
            docs/research/desktop-mobile-control.md \
            .devcontainer/Dockerfile \
            .devcontainer/devcontainer.json \
            tools/preflight.sh \
            tools/render-brand.py \
            tools/build-package.sh \
            tools/fatread.py \
            tests/qemu/rpi-gui-test.sh \
            targets/rpi/config \
            targets/rpi/build.sh \
            targets/rpi/stage-cybroidos/EXPORT_IMAGE \
            targets/rpi/stage-cybroidos/00-cybroidos/02-kiosk.sh \
            targets/rpi/stage-cybroidos/00-cybroidos/03-packages.sh \
            targets/rpi/stage-cybroidos/00-cybroidos/files/etc/systemd/system/cybroidos-kiosk.service \
            targets/rpi/stage-cybroidos/00-cybroidos/files/usr/bin/cybroidos-kiosk \
            targets/rpi/stage-cybroidos/00-cybroidos/files/usr/bin/cybroidos-first-boot \
            targets/rpi/stage-cybroidos/00-cybroidos/files/etc/systemd/system/cybroidos-first-boot.service \
            targets/rpi/stage-cybroidos/00-cybroidos/files/etc/cybroidos/kiosk.conf \
            common/packages/cybroidos-base/debian/control \
            common/packages/cybroidos-base/debian/rules \
            common/packages/cybroidos-kiosk/debian/control \
            common/packages/cybroidos-kiosk/debian/rules \
            common/packages/cybroidos-rpi/debian/control \
            common/packages/cybroidos-rpi/debian/rules \
            common/packages/cybroidos-desktop/debian/control \
            common/packages/cybroidos-desktop/debian/rules \
            common/packages/cybroidos-desktop-lite/debian/control \
            common/packages/cybroidos-desktop-lite/debian/rules \
            common/packages/cybroidos-server/debian/control \
            common/packages/cybroidos-server/debian/rules \
            common/packages/cybroidos-control/debian/control \
            common/packages/cybroidos-control/debian/rules \
            common/packages/cybroidos-control/debian/payload/usr/bin/cybroidos-control \
            common/packages/cybroidos-control/debian/payload/usr/share/cybroidos/control/actions.json \
            apps/mobile/cybroidos_connect/pubspec.yaml \
            apps/mobile/cybroidos_connect/lib/cybroidos_connect.dart \
            apps/mobile/cybroidos_control_app/pubspec.yaml \
            apps/mobile/cybroidos_control_app/lib/main.dart \
            apps/mobile/relay/setup-relay.sh \
            docs/mobile/README.md \
            targets/desktop/build.sh \
            targets/desktop/README.md \
            tests/desktop/iso-smoke-test.sh \
            .github/workflows/desktop-iso.yml \
            targets/docker/build.sh \
            targets/docker/README.md \
            targets/docker/base/Dockerfile \
            targets/docker/dev/Dockerfile \
            targets/docker/desktop/Dockerfile \
            targets/docker/dev/devcontainer.json \
            targets/docker/dev/stacks.json \
            targets/docker/config/install-kcd.sh \
            targets/docker/config/first-boot.sh \
            tests/container/smoke-test.sh \
            .github/workflows/containers.yml \
            targets/server/build.sh \
            targets/server/README.md \
            targets/server/hooks/install-local-debs.sh \
            targets/server/hooks/install-kcd.sh \
            targets/server/hooks/apply-branding.sh \
            targets/server/hooks/configure-cloud-init.sh \
            targets/server/hooks/first-boot.sh \
            targets/server/config/cloud-init/user-data.tmpl \
            targets/server/config/cloud-init/meta-data.tmpl \
            targets/server/config/cloud-init/90-cybroidos.cfg \
            targets/server/config/xrdp/startwm.sh \
            targets/server/config/xfce-session \
            tests/server/smoke-test.sh \
            .github/workflows/server-image.yml \
            common/branding/brand.toml \
            common/branding/logo/cybroid-logo.svg ; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "all required files present"

  build-base-package:
    name: Build & verify cybroidos-base (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 build-essential dpkg-dev \
            debhelper fakeroot lintian

      - name: Build .deb
        run: tools/build-package.sh cybroidos-base

      - name: Inspect .deb
        run: |
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb

      - name: Install and verify branding
        run: |
          dpkg -i dist/*.deb
          grep -q '^ID=cybroidos' /etc/os-release
          grep -q 'Cybroid OS' /etc/motd
          test -f /etc/issue
          echo "cybroidos-base installs and applies branding"

      - name: Lintian (non-fatal)
        run: lintian dist/*.deb || true

  shellcheck:
    name: Shellcheck (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git shellcheck

      - name: Shellcheck all shell scripts
        shell: bash
        run: |
          mapfile -t files < <(find tools ci tests targets -name '*.sh' 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell scripts yet"
            exit 0
          fi
          shellcheck -x "${files[@]}"

  build-metapackages:
    name: Build Cybroid OS packages (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 build-essential dpkg-dev \
            debhelper fakeroot lintian

      - name: Build every metapackage
        run: |
          for pkg in cybroidos-kiosk cybroidos-rpi \
                     cybroidos-desktop cybroidos-desktop-lite cybroidos-server \
                     cybroidos-control; do
            tools/build-package.sh "$pkg"
          done

      - name: Inspect metapackages
        run: |
          for deb in dist/cybroidos-*.deb; do
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done

  # Full image builds are triggered by target-specific workflows:
  # pi-image.yml, desktop-iso.yml, server-image.yml and containers.yml.
