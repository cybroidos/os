# Cybroid OS server/pods xrdp configuration (RDP is the primary remote path,
# ADR-0005). Xorg sessions run /etc/xrdp/startwm.sh, which launches Xfce 4.20.
# Debian's sesman.ini is kept unchanged; this file only fixes the session type.
[Globals]
ini_version=1
fork=true
port=3389
runtime_user=xrdp
runtime_group=xrdp
tcp_nodelay=true
tcp_keepalive=true
security_layer=tls
crypt_level=high
; Debian's xrdp postinst generates this self-signed certificate/key.
certificate=/etc/xrdp/cert.pem
key_file=/etc/xrdp/key.pem
ssl_protocols=TLSv1.2, TLSv1.3
autorun=Xorg
allow_channels=true
allow_multimon=true
bitmap_cache=true
bitmap_compression=true
bulk_compression=true
max_bpp=32
new_cursors=true
use_fastpath=both

[Logging]
LogFile=xrdp.log
LogLevel=INFO
EnableSyslog=true

[Channels]
rdpdr=true
rdpsnd=true
drdynvc=true
cliprdr=true
rail=true
xrdpvr=true

[Xorg]
name=Cybroid Xfce
lib=libxup.so
username=ask
password=ask
port=-1
code=20
