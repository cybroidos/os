# Cybroid OS server/pods SSH policy: no default password, public keys only.
# Installed as /etc/ssh/sshd_config.d/90-cybroidos.conf (OpenSSH 9+/10 syntax).
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PubkeyAuthentication yes
PermitRootLogin no
UsePAM yes
