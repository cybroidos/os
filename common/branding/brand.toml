# Cybroid OS brand identity
#
# Single source of truth for branding values. Builders and packages read this
# file (or values rendered from it) so branding is defined exactly once.
#
# Palette is DERIVED from the official Cybroid logo gradient found in
# novaoneltd/cit -> extension/media/cybroid-logo.svg (stop-colors #557fc0 -> #69cce1
# over navy #112649 / #0e2044). Confirm/adjust with the brand owner before a
# release; treat these as v0 defaults.

[identity]
name            = "Cybroid OS"
id              = "cybroidos"                 # os-release ID, hostname, package prefix
vendor          = "Cybroid Technologies (U) Ltd"
vendor_short    = "Cybroid"
pretty_name     = "Cybroid OS"
version         = "0.1.0"
default_hostname = "cybroid"
support_url     = "https://cybroid.com"
home_url        = "https://cybroid.com"
documentation   = "https://github.com/cybroidtech/os"
bug_report_url  = "https://github.com/cybroidtech/os/issues"

[colors]
# Roles. Derived from the Cybroid logo SVG; see header note.
primary        = "#112649"   # deep navy — primary brand / dark surfaces
primary_deep   = "#0e2044"   # darker navy — deepest background
accent         = "#69cce1"   # cyan — primary accent / highlights
accent_alt     = "#557fc0"   # blue — secondary accent (logo gradient start)
background     = "#0e2044"
foreground     = "#ffffff"
on_accent      = "#0e2044"

[assets]
# Paths are relative to common/branding/
logo_svg       = "logo/cybroid-logo.svg"     # primary vector lockup
logo_png       = "logo/cybroid-logo.png"     # 1254x1254 transparent PNG
mark_png       = "logo/cybroid-mark.png"     # 256x256 square mark/icon
icon_64_png    = "logo/cybroid-icon-64.png"  # 64x64
favicon_png    = "logo/cybroid-favicon.png"  # 225x225
