name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# All jobs run INSIDE Debian 13 "Trixie" so CI matches the shipping base OS
# (ADR-0001). The runner host is Ubuntu only because GitHub does not offer a
# Debian runner image; the `container:` keeps the job environment on Debian.
jobs:
  validate-repo:
    name: Validate repo & branding (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3

      - name: Validate brand.toml and targets.toml
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          root = pathlib.Path("common/branding")
          data = tomllib.loads((root / "brand.toml").read_text())
          for section in ("identity", "colors", "assets"):
              assert section in data, f"missing [{section}] in brand.toml"
          for role, rel in data["assets"].items():
              assert (root / rel).is_file(), f"asset {role}: missing {rel}"
          targets = tomllib.loads((root / "targets.toml").read_text())
          for name in ("base", "rpi", "desktop", "server", "container"):
              assert name in targets, f"missing [{name}] in targets.toml"
          ident = data["identity"]
          print(f"brand OK: {ident['name']} (id={ident['id']}), targets: {', '.join(targets)}")
          PY

      - name: The version has a changelog entry
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("common/branding/brand.toml","rb"))["identity"]["version"])')"
          grep -q "^## \[${version}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for ${version} (brand.toml)"; exit 1; }
          echo "version ${version}: in CHANGELOG.md"

      - name: Validate SVGs are well-formed
        run: |
          python3 - <<'PY'
          import pathlib, xml.dom.minidom
          for f in sorted(pathlib.Path("common/branding").rglob("*.svg")):
              if "templates" in f.parts:
                  continue  # templates hold ${placeholders}; checked after rendering
              xml.dom.minidom.parse(str(f))
              print(f"SVG OK: {f}")
          PY

      - name: Validate devcontainer.json
        run: |
          python3 - <<'PY'
          import json, pathlib
          f = pathlib.Path(".devcontainer/devcontainer.json")
          cfg = json.loads(f.read_text())
          assert "build" in cfg, "devcontainer.json missing 'build'"
          print(f"devcontainer.json OK: {cfg.get('name', '?')}")
          PY

      - name: Syntax-check tooling
        run: |
          python3 -m py_compile tools/*.py
          echo "tools compile"
          for f in targets/*/build*.sh targets/lib/*.sh tools/*.sh; do bash -n "$f"; done
          for f in common/packages/*/postinst common/packages/*/prepare; do [ -f "$f" ] && sh -n "$f"; done
          echo "build scripts parse"

      - name: Check required files exist
        run: |
          for f in \
            README.md LICENSE LICENSE-ASSETS NOTICE.md CONTRIBUTING.md CHANGELOG.md CODE_OF_CONDUCT.md \
            docs/PLAN.md docs/SECURITY.md docs/LICENSING.md docs/PROPRIETARY-COMPONENTS.md \
            docs/RELEASE-CHECKLIST.md docs/user/INSTALL.md \
            docs/adr/ADR-0001-base-distribution.md \
            docs/adr/ADR-0003-desktop-environment.md \
            docs/adr/ADR-0007-shared-packages-and-apt-repo.md \
            .devcontainer/Dockerfile \
            .devcontainer/devcontainer.json \
            tools/render-brand.py tools/brand_anim.py tools/build-package.sh tools/boot-menu.py \
            tools/release-manifest.sh tools/check-proprietary.sh \
            targets/desktop/build-iso.sh targets/server/build.sh targets/container/build.sh \
            common/packages/copyright \
            common/packages/cybroid-base/control \
            common/packages/cybroid-plasma/control \
            common/branding/brand.toml \
            common/branding/targets.toml ; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "all required files present"

  render-branding:
    name: Render branding for every target (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 librsvg2-bin

      - name: Render all targets
        run: |
          for t in $(python3 tools/render-brand.py --list | awk '{print $1}'); do
            python3 tools/render-brand.py --target "$t" --out "out/branding/$t"
          done

      - name: Check rendered output
        run: |
          python3 - <<'PY'
          import pathlib, xml.dom.minidom
          out = pathlib.Path("out/branding")
          for t in ("base", "rpi", "desktop", "server", "container"):
              rel = (out / t / "usr/lib/os-release").read_text()
              assert "ID=cybroid" in rel, t
          for f in out.rglob("*.svg"):
              xml.dom.minidom.parse(str(f))
          for f in out.rglob("*.png"):
              assert f.read_bytes()[:8] == b"\x89PNG\r\n\x1a\n" and f.stat().st_size > 100, f
          for f in out.rglob("*"):
              if f.suffix in (".html", ".script", ".plymouth", ".svg") or f.name in ("motd", "issue", "os-release"):
                  assert "${" not in f.read_text(), f"unrendered placeholder in {f}"
          print("rendered branding OK")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: cybroidos-branding
          path: out/branding/

  build-packages:
    name: Build, install and remove the CybroidOS packages (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 dpkg-dev librsvg2-bin lintian

      - name: Build packages
        run: tools/build-package.sh --all

      - name: Inspect packages
        run: |
          for deb in dist/*.deb; do echo "== $deb"; dpkg-deb -I "$deb" | sed -n '/Package:/,/Description:/p'; done

      - name: Install on a clean Trixie root
        run: |
          # The identity and artwork every image starts from (the desktop
          # itself is checked by building the ISO).
          apt-get install -y --no-install-recommends \
            ./dist/cybroid-base_*.deb ./dist/cybroid-artwork_*.deb \
            ./dist/cybroid-plymouth-theme_*.deb

      - name: Verify what the packages did
        run: |
          set -x
          grep -q '^ID=cybroid' /etc/os-release
          grep -q 'CybroidOS' /etc/motd
          grep -q '^Theme=cybroid$' /etc/plymouth/plymouthd.conf
          test -f /usr/share/plymouth/themes/cybroid/anim-000.png
          test -f /usr/share/icons/hicolor/256x256/apps/cybroid.png
          test -f /usr/share/backgrounds/cybroid/cybroid-hex-hud-1920x1080.png

      - name: Remove and check base-files is restored
        run: |
          apt-get remove -y cybroid-base cybroid-artwork cybroid-plymouth-theme
          grep -q '^ID=debian' /etc/os-release
          ! grep -q '^Theme=cybroid$' /etc/plymouth/plymouthd.conf

      - name: Lintian (non-fatal)
        run: lintian dist/*.deb || true

      - uses: actions/upload-artifact@v4
        with:
          name: cybroid-packages-all
          path: dist/*.deb

  shellcheck:
    name: Shellcheck (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git shellcheck

      - name: Shellcheck all shell scripts
        shell: bash
        run: |
          mapfile -t files < <(find tools ci tests targets -name '*.sh' 2>/dev/null || true)
          files+=(common/packages/*/prepare)
          # Our own scripts installed by the packages (shell ones only).
          while IFS= read -r f; do files+=("$f"); done < <(grep -rlE '^#!/bin/(ba)?sh' common/packages/*/files/usr/libexec common/packages/*/files/usr/bin common/packages/*/files/etc/NetworkManager common/packages/*/files/etc/grub.d 2>/dev/null)
          for f in common/packages/*/{preinst,postinst,prerm,postrm}; do
            [ -f "$f" ] && files+=("$f")
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell scripts yet"
            exit 0
          fi
          shellcheck -x -S warning "${files[@]}"

  # Contributions are signed off (Developer Certificate of Origin,
  # CONTRIBUTING.md): every commit in a pull request says "Signed-off-by:".
  dco:
    name: Signed-off commits (DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::$(git log -1 --format='%h %s' "$c") has no Signed-off-by line (git commit -s)"
              bad=1
            fi
          done
          exit $bad
