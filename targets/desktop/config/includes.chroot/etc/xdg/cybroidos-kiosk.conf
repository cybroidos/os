# KDE Kiosk starting profile for shared Cybroid school machines (ADR-0003).
# Generated by targets/desktop/build.sh from the edition flags. The exact rule
# set is still being refined with schools; this is the conservative default.
[General]
Enabled=@KIOSK_ENABLED@
Profile=CybroidOS

[Restrictions]
CanChangeWallpaper=false
CanChangeSystemSettings=false
CanInstallApplications=false
CanAccessTerminal=false
CanChangeLanguage=false
CanRemoveApps=false

[Applications]
Allowed=konsole,dolphin,firefox-esr,okular,libreoffice-writer,libreoffice-calc
