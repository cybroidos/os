# CybroidOS (cybroid-base): kernel hardening on every CybroidOS system,
# beyond Debian's defaults (measured on a Debian 13 install: ptrace 0,
# kptr 0, rp_filter 0, send_redirects 1, sysrq 438). An administrator can
# override any line in /etc/sysctl.d/.

# A program may read another's memory only if it started it (debuggers
# still work on what they launch; "sudo gdb -p" for the rest). Stops a
# compromised app from reading the browser's or the password store's memory.
kernel.yama.ptrace_scope = 1
# Kernel addresses hidden from ordinary users (they help exploits).
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
# Magic SysRq: only sync, remount read-only and reboot (Ubuntu's choice).
kernel.sysrq = 176
# No core dumps from programs that changed privilege.
fs.suid_dumpable = 0
fs.protected_fifos = 2
fs.protected_regular = 2
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# Network: drop packets whose source can't be reached back (loose mode, so
# Tower and other VPNs still work), never follow or send redirects (this is
# not a router), keep SYN cookies against floods.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.tcp_syncookies = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
