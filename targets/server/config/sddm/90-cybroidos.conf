# SDDM compatibility config. The server image uses LightDM for Xfce, but if an
# operator swaps in SDDM this keeps the branded background and disables guests.
# (No custom SDDM QML theme is shipped; 'breeze' is Debian's maintained theme.)
[Theme]
Current=breeze
Background=/usr/share/backgrounds/cybroidos/cybroidos-wallpaper.png

[Users]
HideUsers=true
RememberLastUser=false
