name: Server images

# CIT-OS Server as a VM image (qcow2, cloud-init) and as a container template
# (Proxmox LXC; imports into Docker too), uploaded to the citos-images bucket
# on Hangar's storage (s3.cybroid.com), where Hangar's Images page prepares
# them for launching. The desktop VM is CIT-OS Desktop Lite (Xfce, xrdp).
#
# Secrets: CITOS_IMAGES_KEY_ID, CITOS_IMAGES_SECRET (a Garage key that can
# write only to the citos-images bucket).
on:
  workflow_dispatch:
  # Every branch builds and uploads: Hangar takes the newest build.
  push:
    paths:
      - 'common/branding/**'
      - 'common/packages/citos-base/**'
      - 'common/packages/citos-artwork/**'
      - 'common/packages/citos-desktop/**'
      - 'common/packages/citos-sources/**'
      - 'common/packages/citos-plasma/**'
      - 'common/packages/citos-plymouth-theme/**'
      - 'tools/render-brand.py'
      - 'targets/lib/**'
      - 'targets/server/**'
      - 'targets/container/**'
      - '.github/workflows/server-images.yml'

permissions:
  contents: read

concurrency:
  group: server-images
  cancel-in-progress: true

env:
  S3_URL: https://s3.cybroid.com
  BUCKET: citos-images

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [ vm, desktop, lite, container ]
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-utils zstd dpkg-dev cloud-guest-utils e2fsprogs librsvg2-bin

      - name: Build the VM image
        if: matrix.image == 'vm'
        run: sudo OUT="$PWD/out" targets/server/build.sh

      # Rounded windows for CIT-OS Desktop: KDE Rounded Corners (GPL-3.0,
      # github.com/matinlotfali/KDE-Rounded-Corners), compiled in a Debian 13
      # container against Debian's own KWin, the way its project builds it.
      # Built here, not in a job of its own: the account's artifact storage
      # is full.
      - name: Build the rounded-corners effect
        if: matrix.image == 'desktop'
        run: |
          mkdir -p dist/extra
          docker run --rm -v "$PWD/dist/extra:/out" -e VERSION=v0.11.0 debian:trixie sh -ec '
            apt-get update -q
            apt-get install -y -q --no-install-recommends ca-certificates git cmake g++ gettext extra-cmake-modules \
              qt6-base-private-dev qt6-base-dev-tools libkf6configwidgets-dev libkf6kcmutils-dev kwin-dev libdrm-dev dpkg-dev file >/dev/null
            git clone -q --depth 1 --branch "$VERSION" https://github.com/matinlotfali/KDE-Rounded-Corners /src
            cd /src && cmake . -DCMAKE_BUILD_TYPE=Release >/dev/null && cmake --build . -j"$(nproc)" >/dev/null && cpack -G DEB >/dev/null
            cp kwin4_effect_shapecorners*.deb /out/citos-kwin-effects_amd64.deb'
          ls -la dist/extra

      # The dock floats above the screen's edge like macOS's: Debian's own
      # Plank, rebuilt with tools/plank-edge-gap.py (PLANK_EDGE_GAP), as
      # 0.11.89-6+citos1 so it takes Debian's place.
      - name: Build the dock (Plank with an edge gap)
        if: matrix.image == 'desktop'
        run: |
          docker run --rm -v "$PWD/dist/extra:/out" -v "$PWD/tools:/tools:ro" debian:trixie sh -ec '
            printf "Types: deb deb-src\nURIs: http://deb.debian.org/debian\nSuites: trixie trixie-updates\nComponents: main\nSigned-By: /usr/share/keyrings/debian-archive-keyring.gpg\n\nTypes: deb deb-src\nURIs: http://deb.debian.org/debian-security\nSuites: trixie-security\nComponents: main\nSigned-By: /usr/share/keyrings/debian-archive-keyring.gpg\n" > /etc/apt/sources.list.d/debian.sources
            apt-get update -q
            apt-get install -y -q --no-install-recommends dpkg-dev devscripts python3 >/dev/null
            apt-get build-dep -y -q plank >/dev/null
            mkdir /src && cd /src && apt-get source -q plank >/dev/null && cd plank-*/
            python3 /tools/plank-edge-gap.py .
            DEBEMAIL=citos@cybroid.com DEBFULLNAME=CIT-OS dch -l +citos "Float a bottom dock above the edge of the screen (PLANK_EDGE_GAP)." >/dev/null
            DEB_BUILD_OPTIONS="nocheck parallel=$(nproc)" dpkg-buildpackage -b -uc -us >/dev/null
            cp ../plank_*+citos*_amd64.deb ../libplank1_*+citos*_amd64.deb ../libplank-common_*+citos*_all.deb /out/'
          ls -la dist/extra

      # App icons: WhiteSur (GPL-3.0, github.com/vinceliuice/WhiteSur-icon-theme)
      # at a fixed release, installed with -a (its own file-manager and store
      # icons) as an unprivileged user inside the build container, then
      # tools/icons-fixups.sh (no Apple Photos flower), packed as citos-icons.
      - name: Build the icons (citos-icons)
        if: matrix.image == 'desktop'
        run: |
          docker run --rm -v "$PWD/dist/extra:/out" -v "$PWD/tools:/tools:ro" -e REF=2026-09-10 debian:trixie sh -ec '
            apt-get update -q
            apt-get install -y -q --no-install-recommends ca-certificates git gtk-update-icon-cache libgtk-3-bin >/dev/null 2>&1 || apt-get install -y -q --no-install-recommends ca-certificates git >/dev/null
            useradd -m build
            su build -c "git clone -q --depth 1 --branch $REF https://github.com/vinceliuice/WhiteSur-icon-theme /home/build/src && mkdir -p /home/build/out && cd /home/build/src && ./install.sh -a -d /home/build/out -n WhiteSur >/dev/null"
            sh /tools/icons-fixups.sh /home/build/out
            p=/home/build/pkg; mkdir -p $p/DEBIAN $p/usr/share/icons $p/usr/share/doc/citos-icons
            cp -a /home/build/out/WhiteSur* $p/usr/share/icons/
            cp /home/build/src/COPYING $p/usr/share/doc/citos-icons/copyright 2>/dev/null || cp /home/build/src/LICENSE $p/usr/share/doc/citos-icons/copyright
            printf "Package: citos-icons\nVersion: %s\nArchitecture: all\nMaintainer: CIT-OS <citos@cybroid.com>\nSection: x11\nPriority: optional\nDescription: CIT-OS app icons (WhiteSur, %s)\n Rounded-square app icons for CIT-OS Desktop: WhiteSur by Vince Liuice,\n GPL-3.0, with CIT-OS fixups.\n" "$(echo $REF | tr -d -)+citos1" "$REF" > $p/DEBIAN/control
            printf "#!/bin/sh\nset -e\nif [ \"\$1\" = configure ] && command -v gtk-update-icon-cache >/dev/null; then for t in /usr/share/icons/WhiteSur*; do gtk-update-icon-cache -q -f \"\$t\" || true; done; fi\n" > $p/DEBIAN/postinst
            chmod 0755 $p/DEBIAN/postinst
            chown -R root:root $p
            dpkg-deb --root-owner-group -Zxz --build $p /out/citos-icons_all.deb >/dev/null'
          ls -la dist/extra

      - name: Build the desktop VM image (CIT-OS Desktop, KDE Plasma)
        if: matrix.image == 'desktop'
        run: sudo VARIANT=desktop EXTRA_DEBS="$PWD/dist/extra" OUT="$PWD/out" targets/server/build.sh

      - name: Build the light desktop VM image (CIT-OS Lite, Xfce)
        if: matrix.image == 'lite'
        run: sudo VARIANT=lite OUT="$PWD/out" targets/server/build.sh

      - name: Build the container template
        if: matrix.image == 'container'
        run: sudo OUT="$PWD/out" targets/container/build.sh

      - name: Check the image
        run: |
          sudo chown -R "$(id -u)" out
          ls -lh out/
          if [ "${{ matrix.image }}" = vm ]; then
            qemu-img check out/citos-server-*-amd64.qcow2
          elif [ "${{ matrix.image }}" = desktop ] || [ "${{ matrix.image }}" = lite ]; then
            qemu-img check out/citos-${{ matrix.image }}-*-amd64.qcow2
          else
            zstd -dc out/citos-server_*_amd64.tar.zst | tar -xOf - ./usr/lib/os-release | tee /dev/stderr | grep -q '^ID=citos'
            zstd -dc out/citos-server_*_amd64.tar.zst | tar -xOf - ./etc/apt/sources.list.d/citos.sources | grep -q 'citos.cybroid.com/debian'
          fi

      - name: Upload to Hangar's storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CITOS_IMAGES_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CITOS_IMAGES_SECRET }}
          AWS_DEFAULT_REGION: garage
        run: |
          [ -n "$AWS_ACCESS_KEY_ID" ] || { echo "::warning::No CITOS_IMAGES_KEY_ID secret: built but not uploaded"; exit 0; }
          # Hangar's storage sits behind an office line: the classic transfer
          # engine (no minimum speed), two parts at a time, three tries.
          aws configure set default.s3.preferred_transfer_client classic
          aws configure set default.s3.max_concurrent_requests 2
          aws configure set default.s3.multipart_chunksize 16MB
          s3() { for try in 1 2 3; do aws --endpoint-url "$S3_URL" --cli-read-timeout 300 s3 "$@" && return 0; echo "upload try $try failed, retrying"; sleep 20; done; return 1; }
          if [ "${{ matrix.image }}" = vm ]; then
            f=$(ls out/citos-server-*-amd64.qcow2); key=server/citos-server-amd64.qcow2
          elif [ "${{ matrix.image }}" = desktop ] || [ "${{ matrix.image }}" = lite ]; then
            f=$(ls out/citos-${{ matrix.image }}-*-amd64.qcow2); key=desktop/citos-${{ matrix.image }}-amd64.qcow2
          else
            f=$(ls out/citos-server_*_amd64.tar.zst); key=server/citos-server_amd64.tar.zst
          fi
          sum=$(sha256sum "$f" | cut -d' ' -f1)
          s3 cp --only-show-errors "$f" "s3://$BUCKET/$key" --metadata "sha256=$sum,commit=$GITHUB_SHA"
          echo "$sum  $(basename "$key")" > "$f.sha256"
          s3 cp --only-show-errors "$f.sha256" "s3://$BUCKET/$key.sha256"
          echo "Uploaded $key ($(du -h "$f" | cut -f1), sha256 $sum)" >> "$GITHUB_STEP_SUMMARY"
