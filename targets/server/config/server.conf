# Cybroid OS server/pods runtime settings.
# Installed as /etc/cybroidos/server.conf. Shell-sourced by
# /etc/cybroidos/xfce-session and /usr/bin/cybroidos-first-boot.
# Rendered from targets/server/config/server.conf at image build time.

VERSION=__CYBROIDOS_VERSION__
HOSTNAME=__CYBROIDOS_HOSTNAME__
ADMIN_USER=cybroid

# Xfce session and remote access (RDP primary, noVNC fallback — ADR-0005).
XFCE_SESSION=/usr/bin/startxfce4
SESSION_DISPLAY=:99
SESSION_GEOMETRY=1280x800x24
RDP_ENABLE=1
RDP_PORT=3389
NOVNC_ENABLE=1
NOVNC_PORT=6080
VNC_PORT=5900

# Security defaults: never a password login, never root SSH.
SSH_PUBKEY_ONLY=1
SSH_PORT=22
KCD_ENABLE=1
KCD_TCP_PORT=1716
