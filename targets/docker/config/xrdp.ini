; Minimal Cybroid OS xrdp configuration (RDP primary, ADR-0005).
; Session start command is /etc/xrdp/startwm.sh (Xfce).
[Globals]
ini_version=1
fork=true
port=3389
use_vsock=false
tcp_nodelay=true
tcp_keepalive=true
security_layer=negotiate
crypt_level=high
certificate=/etc/ssl/certs/ssl-cert-snakeoil.pem
key_file=/etc/ssl/private/ssl-cert-snakeoil.key
ssl_protocols=TLSv1.2, TLSv1.3
allow_channels=true
allow_multimon=true
bitmap_cache=true
bitmap_compression=true
bulk_compression=true
max_bpp=24
new_cursors=true
use_fastpath=both

[Logging]
LogFile=/var/log/xrdp.log
LogLevel=INFO
EnableSyslog=false

[Channels]
rdpdr=true
rdpsnd=true
drdynvc=true
cliprdr=true
rail=true
xrdpvr=true

[Xorg]
name=Xorg
lib=libxup.so
username=ask
password=ask
port=-1
code=20
