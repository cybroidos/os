name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# All jobs run INSIDE Debian 13 "Trixie" so CI matches the shipping base OS
# (ADR-0001). The runner host is Ubuntu only because GitHub does not offer a
# Debian runner image; the `container:` keeps the job environment on Debian.
jobs:
  validate-repo:
    name: Validate repo & branding (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3

      - name: Validate brand.toml
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("common/branding/brand.toml").read_text())
          for section in ("identity", "colors", "assets"):
              assert section in data, f"missing [{section}] in brand.toml"
          ident = data["identity"]
          print(f"brand.toml OK: {ident['name']} (id={ident['id']})")
          PY

      - name: Validate logo SVG is well-formed
        run: |
          python3 - <<'PY'
          import pathlib, xml.dom.minidom
          f = pathlib.Path("common/branding/logo/cit-logo.svg")
          xml.dom.minidom.parse(str(f))
          print(f"SVG OK: {f}")
          PY

      - name: Check required files exist
        run: |
          for f in \
            README.md \
            docs/PLAN.md \
            docs/adr/ADR-0001-base-distribution.md \
            docs/adr/ADR-0003-desktop-environment.md \
            docs/research/kiosk-runtime.md \
            docs/research/desktop-environment.md \
            docs/research/desktop-mobile-control.md \
            common/branding/brand.toml \
            common/branding/logo/cit-logo.svg ; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "all required files present"

  shellcheck:
    name: Shellcheck (Debian 13 / Trixie)
    runs-on: ubuntu-24.04
    container: debian:13-slim
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git shellcheck

      - name: Shellcheck all shell scripts
        shell: bash
        run: |
          mapfile -t files < <(find tools ci tests -name '*.sh' 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no shell scripts yet"
            exit 0
          fi
          shellcheck -x "${files[@]}"

  # Build jobs (Pi, desktop, server, docker) are added in later phases.
  # See docs/PLAN.md — Phase 3 onwards.
